<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270"><style>
.bob{animation:bob 1.2s ease-in-out infinite}
.wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave .8s ease-in-out infinite alternate}
.legA{transform-box:fill-box;transform-origin:50% 0%;animation:step .6s ease-in-out infinite alternate}
.legB{transform-box:fill-box;transform-origin:50% 0%;animation:step .6s ease-in-out infinite alternate-reverse}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 1.6s ease-in-out infinite}
.blink{animation:blink 1.4s steps(2) infinite}
.draw{stroke-dasharray:400;animation:draw 3s linear infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 8s linear infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wave{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
@keyframes step{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes blink{50%{opacity:.35}}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
</style><defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs><rect width="480" height="270" fill="url(#sky)"/><rect x="0" y="80" width="55" height="120" fill="#0f172a"/><rect class="blink" x="12" y="95" width="8" height="8" fill="#fbbf24" style="animation-delay:0.0s"/><rect x="60" y="30" width="55" height="170" fill="#0f172a"/><rect class="blink" x="72" y="45" width="8" height="8" fill="#fbbf24" style="animation-delay:0.3s"/><rect x="130" y="100" width="55" height="100" fill="#0f172a"/><rect class="blink" x="142" y="115" width="8" height="8" fill="#fbbf24" style="animation-delay:0.6s"/><rect x="300" y="50" width="55" height="150" fill="#0f172a"/><rect class="blink" x="312" y="65" width="8" height="8" fill="#fbbf24" style="animation-delay:0.8999999999999999s"/><rect x="365" y="10" width="55" height="190" fill="#0f172a"/><rect class="blink" x="377" y="25" width="8" height="8" fill="#fbbf24" style="animation-delay:1.2s"/><rect x="430" y="70" width="55" height="130" fill="#0f172a"/><rect class="blink" x="442" y="85" width="8" height="8" fill="#fbbf24" style="animation-delay:1.5s"/><rect y="200" width="480" height="70" fill="#020617"/><rect class="blink" x="300" y="55" width="80" height="40" rx="6" fill="none" stroke="#e879f9" stroke-width="4" filter="url(#glow)"/><g class="bob" filter="url(#glow)">
<g fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<line x1="220" y1="113" x2="220" y2="160"/>
<line x1="220" y1="125" x2="192" y2="152"/>
<line class="wave" x1="220" y1="125" x2="262" y2="102"/>
<line class="legA" x1="220" y1="160" x2="202" y2="200"/>
<line class="legB" x1="220" y1="160" x2="238" y2="200"/>
</g>
<circle cx="220" cy="95" r="18" fill="none" stroke="#22d3ee" stroke-width="5"/>
</g><g opacity=".25" transform="translate(0 400) scale(1 -1)"><g class="bob" >
<g fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<line x1="220" y1="113" x2="220" y2="160"/>
<line x1="220" y1="125" x2="192" y2="152"/>
<line class="wave" x1="220" y1="125" x2="262" y2="102"/>
<line class="legA" x1="220" y1="160" x2="202" y2="200"/>
<line class="legB" x1="220" y1="160" x2="238" y2="200"/>
</g>
<circle cx="220" cy="95" r="18" fill="none" stroke="#22d3ee" stroke-width="5"/>
</g></g></svg>
