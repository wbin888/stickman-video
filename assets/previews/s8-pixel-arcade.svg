<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" shape-rendering="crispEdges"><style>
.bob{animation:bob 1.2s ease-in-out infinite}
.wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave .8s ease-in-out infinite alternate}
.legA{transform-box:fill-box;transform-origin:50% 0%;animation:step .6s ease-in-out infinite alternate}
.legB{transform-box:fill-box;transform-origin:50% 0%;animation:step .6s ease-in-out infinite alternate-reverse}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 1.6s ease-in-out infinite}
.blink{animation:blink 1.4s steps(2) infinite}
.draw{stroke-dasharray:400;animation:draw 3s linear infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 8s linear infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wave{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
@keyframes step{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes blink{50%{opacity:.35}}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
</style><defs></defs><rect width="480" height="270" fill="#5eb2ff"/><rect x="80" y="40" width="50" height="10" fill="#fff"/><rect x="70" y="50" width="70" height="10" fill="#fff"/><rect x="60" y="60" width="90" height="10" fill="#fff"/><rect x="320" y="50" width="50" height="10" fill="#fff"/><rect x="310" y="60" width="70" height="10" fill="#fff"/><rect x="300" y="70" width="90" height="10" fill="#fff"/><rect x="0" y="220" width="40" height="10" fill="#22c55e"/><rect x="0" y="230" width="40" height="40" fill="#a16207"/><rect x="6" y="238" width="12" height="8" fill="#854d0e"/><rect x="40" y="220" width="40" height="10" fill="#22c55e"/><rect x="40" y="230" width="40" height="40" fill="#a16207"/><rect x="46" y="238" width="12" height="8" fill="#854d0e"/><rect x="80" y="220" width="40" height="10" fill="#22c55e"/><rect x="80" y="230" width="40" height="40" fill="#a16207"/><rect x="86" y="238" width="12" height="8" fill="#854d0e"/><rect x="120" y="220" width="40" height="10" fill="#22c55e"/><rect x="120" y="230" width="40" height="40" fill="#a16207"/><rect x="126" y="238" width="12" height="8" fill="#854d0e"/><rect x="160" y="220" width="40" height="10" fill="#22c55e"/><rect x="160" y="230" width="40" height="40" fill="#a16207"/><rect x="166" y="238" width="12" height="8" fill="#854d0e"/><rect x="200" y="220" width="40" height="10" fill="#22c55e"/><rect x="200" y="230" width="40" height="40" fill="#a16207"/><rect x="206" y="238" width="12" height="8" fill="#854d0e"/><rect x="240" y="220" width="40" height="10" fill="#22c55e"/><rect x="240" y="230" width="40" height="40" fill="#a16207"/><rect x="246" y="238" width="12" height="8" fill="#854d0e"/><rect x="280" y="220" width="40" height="10" fill="#22c55e"/><rect x="280" y="230" width="40" height="40" fill="#a16207"/><rect x="286" y="238" width="12" height="8" fill="#854d0e"/><rect x="320" y="220" width="40" height="10" fill="#22c55e"/><rect x="320" y="230" width="40" height="40" fill="#a16207"/><rect x="326" y="238" width