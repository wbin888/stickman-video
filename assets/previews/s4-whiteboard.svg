<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270"><style>
.bob{animation:bob 1.2s ease-in-out infinite}
.wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave .8s ease-in-out infinite alternate}
.legA{transform-box:fill-box;transform-origin:50% 0%;animation:step .6s ease-in-out infinite alternate}
.legB{transform-box:fill-box;transform-origin:50% 0%;animation:step .6s ease-in-out infinite alternate-reverse}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 1.6s ease-in-out infinite}
.blink{animation:blink 1.4s steps(2) infinite}
.draw{stroke-dasharray:400;animation:draw 3s linear infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 8s linear infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wave{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
@keyframes step{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes blink{50%{opacity:.35}}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
</style><defs></defs><rect width="480" height="270" fill="#f8fafc"/><rect x="5" y="5" width="470" height="260" fill="none" stroke="#cbd5e1" stroke-width="10"/><rect x="245" y="65" width="70" height="46" rx="6" fill="none" stroke="#1d4ed8" stroke-width="4"/><path class="draw" d="M320 88 h45" stroke="#111" stroke-width="4"/><path d="M357 80 l10 8 l-10 8" stroke="#111" stroke-width="4" fill="none"/><circle cx="405" cy="88" r="25" fill="none" stroke="#16a34a" stroke-width="4"/><path d="M393 88 l8 9 l15 -18" stroke="#16a34a" stroke-width="4" fill="none"/><path d="M260 160 l30 30 m0 -30 l-30 30" stroke="#dc2626" stroke-width="4"/><g class="pop"><g transform="rotate(-35 410 190)"><rect x="380" y="182" width="70" height="16" rx="4" fill="#111"/><path d="M380 182 l-14 8 l14 8 z" fill="#475569"/></g></g><ellipse cx="150" cy="232" rx="34" ry="5" fill="#cbd5e1"/><g class="bob" >
<g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<line x1="150" y1="143" x2="150" y2="190"/>
<line x1="150" y1="155" x2="122" y2="182"/>
<line class="wave" x1="150" y1="155" x2="192" y2="132"/>
<line class="legA" x1="150" y1="190" x2="132" y2="230"/>
<line class="legB" x1="150" y1="190" x2="168" y2="230"/>
</g>
<circle cx="150" cy="125" r="18" fill="none" stroke="#111" stroke-width="5"/><circle cx="144" cy="123" r="2.6" fill="#111"/><circle cx="156" cy="123" r="2.6" fill="#111"/><path d="M144 132 q6 5 12 0" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
</g></svg>
