<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270"><style>
.bob{animation:bob 1.2s ease-in-out infinite}
.wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave .8s ease-in-out infinite alternate}
.legA{transform-box:fill-box;transform-origin:50% 0%;animation:step .6s ease-in-out infinite alternate}
.legB{transform-box:fill-box;transform-origin:50% 0%;animation:step .6s ease-in-out infinite alternate-reverse}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 1.6s ease-in-out infinite}
.blink{animation:blink 1.4s steps(2) infinite}
.draw{stroke-dasharray:400;animation:draw 3s linear infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 8s linear infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wave{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
@keyframes step{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes blink{50%{opacity:.35}}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
</style><defs><filter id="ink"><feTurbulence baseFrequency=".03" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="8"/><feGaussianBlur stdDeviation=".8"/></filter><filter id="mist"><feGaussianBlur stdDeviation="6"/></filter></defs><rect width="480" height="270" fill="#f3ead7"/><path d="M200 170 L270 55 L330 140 L370 85 L470 170 Z" fill="#9ca3af" opacity=".55" filter="url(#mist)"/><path d="M260 185 L320 110 L385 185 Z" fill="#57534e" opacity=".45" filter="url(#mist)"/><path d="M0 210 Q120 200 240 212 T480 208" stroke="#94a3b8" stroke-width="3" fill="none" opacity=".7"/><path d="M40 238 Q160 226 260 238 T480 232" stroke="#94a3b8" stroke-width="2" fill="none" opacity=".5"/><path d="M55 200 Q130 214 205 200 L192 214 Q130 224 68 214 Z" fill="#1c1917" filter="url(#ink)"/><g filter="url(#ink)"><g class="bob" >
<g fill="none" stroke="#1c1917" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<line x1="130" y1="115" x2="130" y2="162"/>
<line x1="130" y1="127" x2="102" y2="154"/>
<line class="wave" x1="130" y1="127" x2="172" y2="104"/>
<line class="legA" x1="130" y1="162" x2="112" y2="202"/>
<line class="legB" x1="130" y1="162" x2="148" y2="202"/>
</g><path d="M130 130 q-16 30 -12 55 M130 130 q16 30 13 55" stroke="#78716c" stroke-width="3" fill="none"/>
<circle cx="130" cy="97" r="18" fill="#d6d3d1" stroke="#1c1917" stroke-width="5"/>
</g></g><ellipse class="pop" cx="225" cy="216" rx="14" ry="5" fill="none" stroke="#b91c1c" stroke-width="2"/><rect x="425" y="20" width="30" height="30" rx="3" fill="#b91c1c"/><rect x="430" y="25" width="20" height="20" fill="none" stroke="#f3ead7" stroke-width="2"/></svg>
