<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270"><style>
.bob{animation:bob 1.2s ease-in-out infinite}
.wave{transform-box:fill-box;transform-origin:0% 100%;animation:wave .8s ease-in-out infinite alternate}
.legA{transform-box:fill-box;transform-origin:50% 0%;animation:step .6s ease-in-out infinite alternate}
.legB{transform-box:fill-box;transform-origin:50% 0%;animation:step .6s ease-in-out infinite alternate-reverse}
.pop{transform-box:fill-box;transform-origin:50% 50%;animation:pop 1.6s ease-in-out infinite}
.blink{animation:blink 1.4s steps(2) infinite}
.draw{stroke-dasharray:400;animation:draw 3s linear infinite}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 8s linear infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes wave{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
@keyframes step{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes blink{50%{opacity:.35}}
@keyframes draw{from{stroke-dashoffset:400}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
</style><defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#3b82f6" stroke-width=".6"/></pattern><pattern id="G" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#60a5fa" stroke-width="1.2"/></pattern></defs><rect width="480" height="270" fill="#1e3a8a"/><rect width="480" height="270" fill="url(#g)"/><rect width="480" height="270" fill="url(#G)"/><g class="bob" >
<g fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<line x1="130" y1="138" x2="130" y2="185"/>
<line x1="130" y1="150" x2="102" y2="177"/>
<line class="wave" x1="130" y1="150" x2="172" y2="127"/>
<line class="legA" x1="130" y1="185" x2="112" y2="225"/>
<line class="legB" x1="130" y1="185" x2="148" y2="225"/>
</g>
<circle cx="130" cy="120" r="18" fill="none" stroke="#f8fafc" stroke-width="2.5"/><circle cx="130" cy="150" r="4" fill="none" stroke="#f8fafc" stroke-width="2"/><circle cx="130" cy="185" r="4" fill="none" stroke="#f8fafc" stroke-width="2"/>
</g><g transform="translate(345 115)"><g class="spin"><rect x="-6" y="-50" width="12" height="14" fill="#1e3a8a" stroke="#fb923c" stroke-width="2.5" transform="rotate(0)"/><rect x="-6" y="-50" width="12" height="14" fill="#1e3a8a" stroke="#fb923c" stroke-width="2.5" transform="rotate(45)"/><rect x="-6" y="-50" width="12" height="14" fill="#1e3a8a" stroke="#fb923c" stroke-width="2.5" transform="rotate(90)"/><rect x="-6" y="-50" width="12" height="14" fill="#1e3a8a" stroke="#fb923c" stroke-width="2.5" transform="rotate(135)"/><rect x="-6" y="-50" width="12" height="14" fill="#1e3a8a" stroke="#fb923c" stroke-width="2.5" transform="rotate(180)"/><rect x="-6" y="-50" width="12" height="14" fill="#1e3a8a" stroke="#fb923c" stroke-width="2.5" transform="rotate(225)"/><rect x="-6" y="-50" width="12" height="14" fill="#1e3a8a" stroke="#fb923c" stroke-width="2.5" transform="rotate(270)"/><rect x="-6" y="-50" width="12" height="14" fill="#1e3a8a" stroke="#fb923c" stroke-width="2.5" transform="rotate(315)"/><circle r="38" fill="#1e3a8a" stroke="#fb923c" stroke-width="2.5"/><circle r="10" fill="none" stroke="#fb923c" stroke-width="2.5"/><line x1="0" y1="-38" x2="0" y2="38" stroke="#fb923c" stroke-width="1" stroke-dasharray="4 3"/></g></g><path class="draw" d="M175 150 H285" stroke="#67e8f9" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/><path d="M290 190 H400 M290 184 v12 M400 184 v12" stroke="#f8fafc" stroke-width="1.5"/><path d="M297 186 l-7 4 l7 4 M393 186 l7 4 l-7 4" stroke="#f8fafc" stroke-width="1.5" fill="none"/><rect x="300" y="226" width="164" height="32" fill="none" stroke="#f8fafc" stroke-width="1.5"/><line x1="362" y1="226" x2="362" y2="258" stroke="#f8fafc" stroke-width="1.5"/></svg>
